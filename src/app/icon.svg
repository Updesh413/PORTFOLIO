<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark backdrop -->
  <rect width="32" height="32" rx="0" fill="#0a0a0a" />
  
  <!-- Outer Matrix Green thin border -->
  <rect width="30" height="30" x="1" y="1" rx="0" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.4" />
  
  <!-- Terminal Prompt arrow ">" in Matrix Green -->
  <path d="M8 10L14 16L8 22" fill="none" stroke="#00ff41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Block cursor "_" in Cyber Cyan -->
  <rect x="16" y="20" width="8" height="2.5" fill="#00f1fd" />
</svg>
